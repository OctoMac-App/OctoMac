name: Build and test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes to a pull request replace older runs; every commit on master gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh debug

      - name: Check llms-full.txt is up to date
        run: scripts/make-llms-full.sh --check

      - name: Check for long dashes
        run: |
          if grep -rn '—' README.md CONTRIBUTING.md PRIVACY.md CLAUDE.md llms.txt Sources scripts Tests; then
            echo "Please use a comma, colon or full stop instead of a long dash." && exit 1
          fi
